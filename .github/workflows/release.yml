name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version'
        required: true
        type: string

#permissions:
#  id-token: write # Required for OIDC
#  contents: write # Required for pushing package version tags

jobs:

  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to check out repo (actions/checkout) and commit version changes (changesets/action/version)
      pull-requests: write # to create pull request (changesets/action/version)
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false # recommended: do not persist git credentials on disk

      - name: Install dependencies
        run: npm install

      - name: Version packages
        id: version
        uses: changesets/action/version@v2

